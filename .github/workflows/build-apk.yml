name: Build & Release Android APK

on:
  push:
    branches:
      - main
      - master
    paths-ignore:
      - '**.md'
      - '.gitignore'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  build:
    name: Build & Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Full commit history to calculate commit count versioning

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Determine Version Info
        id: version_info
        run: |
          COMMIT_COUNT=$(git rev-list --count HEAD)
          SHORT_SHA=$(git rev-parse --short HEAD)
          VERSION_CODE=${COMMIT_COUNT}
          VERSION_NAME="1.0.${COMMIT_COUNT}"
          echo "VERSION_CODE=${VERSION_CODE}" >> $GITHUB_OUTPUT
          echo "VERSION_NAME=${VERSION_NAME}" >> $GITHUB_OUTPUT
          echo "SHORT_SHA=${SHORT_SHA}" >> $GITHUB_OUTPUT
          echo "🚀 Building AutoAcceptADB v${VERSION_NAME} (code: ${VERSION_CODE}, commit: ${SHORT_SHA})"

      - name: Build Release and Debug APKs
        run: ./gradlew assembleRelease assembleDebug --stacktrace

      - name: Prepare APK Artifacts
        id: prepare_artifacts
        run: |
          mkdir -p release-artifacts
          VER_NAME="${{ steps.version_info.outputs.VERSION_NAME }}"
          cp app/build/outputs/apk/release/app-release.apk release-artifacts/AutoAcceptADB-v${VER_NAME}-release.apk
          cp app/build/outputs/apk/debug/app-debug.apk release-artifacts/AutoAcceptADB-v${VER_NAME}-debug.apk
          cd release-artifacts
          sha256sum AutoAcceptADB-*.apk > sha256_checksums.txt
          echo "Generated Artifacts & SHA256 Checksums:"
          cat sha256_checksums.txt

      - name: Upload APKs to Workflow Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AutoAcceptADB-v${{ steps.version_info.outputs.VERSION_NAME }}
          path: release-artifacts/*
          if-no-files-found: error
          retention-days: 30

      - name: Create or Update GitHub Release
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version_info.outputs.VERSION_NAME }}
          name: AutoAcceptADB v${{ steps.version_info.outputs.VERSION_NAME }}
          body: |
            ## ⚡ AutoAcceptADB v${{ steps.version_info.outputs.VERSION_NAME }} (Build ${{ steps.version_info.outputs.VERSION_CODE }})
            
            ### 📦 Downloads
            - 🚀 **Release APK (Signed)**: `AutoAcceptADB-v${{ steps.version_info.outputs.VERSION_NAME }}-release.apk`
            - 🧪 **Debug APK**: `AutoAcceptADB-v${{ steps.version_info.outputs.VERSION_NAME }}-debug.apk`
            
            ### 🔍 Build Details
            - **Version Code**: `${{ steps.version_info.outputs.VERSION_CODE }}` (Auto-incremented on every commit)
            - **Version Name**: `${{ steps.version_info.outputs.VERSION_NAME }}`
            - **Commit**: `${{ steps.version_info.outputs.SHORT_SHA }}`
            - **Event**: `${{ github.event_name }}`
          files: |
            release-artifacts/AutoAcceptADB-v${{ steps.version_info.outputs.VERSION_NAME }}-release.apk
            release-artifacts/AutoAcceptADB-v${{ steps.version_info.outputs.VERSION_NAME }}-debug.apk
            release-artifacts/sha256_checksums.txt
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Delete Old Workflow Runs (Keep Latest 3)
        uses: Mattraks/delete-workflow-runs@v2
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        with:
          token: ${{ github.token }}
          repository: ${{ github.repository }}
          retain_minimum_runs: 3
          delete_workflow_pattern: 'build-apk.yml'
